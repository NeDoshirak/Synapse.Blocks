server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    gzip_static on;
    gzip_vary on;

    location = / {
        absolute_redirect off;
        return 302 /game;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:css|json)$ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ^~ /js/ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:js|wasm|dll|dat|webcil|png|jpg|svg|woff2?|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
