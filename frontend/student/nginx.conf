server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    gzip_static on;
    gzip_vary on;

    location = / { return 302 /game; }
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|json|wasm|dll|dat|webcil|png|jpg|svg|woff2?|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
