resolver 127.0.0.11 valid=10s ipv6=off;

upstream synapse_api {
    zone synapse_api 64k;
    server api:8080 resolve;
}
upstream synapse_teacher {
    zone synapse_teacher 64k;
    server teacher:80 resolve;
}
upstream synapse_student {
    zone synapse_student 64k;
    server student:80 resolve;
}

log_format privacy '$request_method $status $server_protocol $host';

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;
    access_log /dev/stdout privacy;

    location = /admin { return 308 /admin/; }
    location = /admin/health { return 404; }
    location = /health/ready {
        proxy_pass http://synapse_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api {
        proxy_pass http://synapse_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /admin/ {
        proxy_pass http://synapse_teacher/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://synapse_student;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
