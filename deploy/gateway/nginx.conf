upstream synapse_api { server api:8080; }
upstream synapse_teacher { server teacher:80; }
upstream synapse_student { server student:80; }

log_format privacy '$request_method $status $server_protocol $host';

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;
    access_log /dev/stdout privacy;

    location = /admin { return 308 /admin/; }
    location = /admin/health { return 404; }
    location = /health/ready {
        proxy_pass http://synapse_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api {
        proxy_pass http://synapse_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /admin/ {
        proxy_pass http://synapse_teacher/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://synapse_student;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
